<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in - Cres OS</title>
  <link rel="icon" href="/icons/cres-os-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="application-name" content="Cres OS" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cres OS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=20261023" />
  <link rel="stylesheet" href="/css/login.css?v=20261109a" />
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <div class="brand-logo-wrap">
        <img class="brand-logo" src="/brand/logo.png?v=20261023" alt="CRES Dynamics" />
      </div>
      <p id="login-subtitle">Cres OS - sign in to continue</p>
    </div>

    <div id="login-error" class="login-error" role="alert"></div>
    <div id="login-ok" class="login-ok" role="status"></div>

    <!-- State: login -->
    <form id="panel-login" class="login-form panel" data-panel="login" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="Your email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="login-submit" id="login-btn">Sign in</button>
      <p class="login-footer">
        <button type="button" class="linkish" id="goto-forgot">Forgot password?</button>
      </p>
    </form>

    <!-- State: accept invite -->
    <form id="panel-invite" class="login-form panel" data-panel="invite" hidden novalidate>
      <p class="hint">You’ve been invited to Cres Dynamics. Choose a password (min 8 characters) to activate your account.</p>
      <div class="field">
        <label for="invite-password">Password</label>
        <input id="invite-password" type="password" minlength="8" required autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="invite-confirm">Confirm password</label>
        <input id="invite-confirm" type="password" minlength="8" required autocomplete="new-password" />
      </div>
      <button type="submit" class="login-submit" id="invite-btn">Activate account</button>
      <p class="login-footer">
        <button type="button" class="linkish" data-back="login">Back to sign in</button>
      </p>
    </form>

    <!-- State: forgot -->
    <form id="panel-forgot" class="login-form panel" data-panel="forgot" hidden novalidate>
      <div class="field">
        <label for="forgot-email">Work email</label>
        <input id="forgot-email" type="email" required placeholder="Your email" />
      </div>
      <button type="submit" class="login-submit" id="forgot-btn">Send reset code</button>
      <p class="login-footer">
        <button type="button" class="linkish" data-back="login">Back to sign in</button>
      </p>
    </form>

    <!-- State: verify code -->
    <form id="panel-verify" class="login-form panel" data-panel="verify" hidden novalidate>
      <p class="hint">Enter the 6-digit code sent to <strong id="verify-email-label"></strong>. It expires in 10 minutes.</p>
      <div class="field">
        <label for="otp-code">Verification code</label>
        <input id="otp-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000" autocomplete="one-time-code" />
      </div>
      <button type="submit" class="login-submit" id="verify-btn">Verify code</button>
      <p class="login-footer">
        <button type="button" class="linkish" data-back="forgot">Resend / change email</button>
      </p>
    </form>

    <!-- State: reset password -->
    <form id="panel-reset" class="login-form panel" data-panel="reset" hidden novalidate>
      <div class="field">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" minlength="8" required autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" type="password" minlength="8" required autocomplete="new-password" />
      </div>
      <button type="submit" class="login-submit" id="reset-btn">Set new password</button>
      <p class="login-footer">
        <button type="button" class="linkish" data-back="login">Back to sign in</button>
      </p>
    </form>
    <button type="button" id="install-app-btn" class="install-app-login" hidden>Install Cres OS on this device</button>
  </main>

  <script src="/js/api.js?v=20261110a"></script>
  <script src="/js/login.js?v=20261024m"></script>
  <script src="/js/pwa.js?v=20261109a"></script>
</body>
</html>
