<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - Cres OS</title>
  <link rel="icon" href="/icons/cres-os-192.png" type="image/png" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1419; color: #e8eef4; font-family: "DM Sans", "Segoe UI", sans-serif; padding: 16px; }
    .card { max-width: 380px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.3rem; margin: 16px 0 8px; }
    p { color: #8b9aab; line-height: 1.5; margin: 0 0 18px; }
    button { background: #00a8c5; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/cres-os-192.png" alt="Cres OS" />
    <h1>You are offline</h1>
    <p>Cres OS needs a connection to load live data. Check your internet, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </div>
  <script src="/js/offline.js"></script>
</body>
</html>
