<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox - Cres OS</title>
  <link rel="icon" href="/icons/cres-os-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="application-name" content="Cres OS" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cres OS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css?v=20261023" />
  <link rel="stylesheet" href="/css/meeting.css?v=20261024m4" />
  <link rel="stylesheet" href="/css/inbox.css?v=20261109c" />
  <link rel="stylesheet" href="/css/toast.css?v=20261109c" />
  <link rel="stylesheet" href="/css/miniShell.css?v=20261109a" />
</head>
<body class="mt-page ib-page">
  <header class="mt-top">
    <a class="mt-brand" href="/dashboard"><img src="/brand/logo-mark.png?v=20261023" alt="" /> <span>CRES OS · Inbox</span></a>
    <div class="mt-top-right">
      <span class="mt-muted small" id="ib-mailbox"></span>
      <a class="mt-link" href="/dashboard">Dashboard</a>
    </div>
  </header>

  <main class="ib-main" id="ib-main" hidden>
    <section class="ib-list-pane">
      <div class="ib-toolbar">
        <div class="ib-tabs" id="ib-tabs" role="tablist">
          <button type="button" class="on" data-status="active">Active <span data-count="active"></span></button>
          <button type="button" data-status="unread">Unread <span data-count="unread"></span></button>
          <button type="button" data-status="read">Read <span data-count="read"></span></button>
          <button type="button" data-status="scam">Spam <span data-count="scam"></span></button>
          <button type="button" data-status="sent">Sent</button>
          <button type="button" data-status="declined">Declined</button>
          <button type="button" data-status="ignored">Ignored</button>
          <button type="button" data-status="deleted">Deleted <span data-count="deleted"></span></button>
          <button type="button" data-status="all">All</button>
        </div>
      </div>
      <div class="ib-toolbar ib-toolbar2">
        <input type="search" id="ib-search" placeholder="Search mail" aria-label="Search mail" />
        <span class="ib-live" id="ib-live" title="Live inbox"><i></i><span>Live</span></span>
        <button type="button" class="mt-btn sm" id="ib-sync" title="Check the mailbox now">⟳ Sync</button>
      </div>
      <div class="ib-bulk" id="ib-bulk">
        <label class="ib-check-all"><input type="checkbox" id="ib-check-all" aria-label="Select all" /> <span id="ib-selected">Select</span></label>
        <div class="ib-bulk-actions" id="ib-bulk-actions" hidden>
          <button type="button" class="mt-btn sm" data-bulk="read">Mark read</button>
          <button type="button" class="mt-btn sm" data-bulk="unread">Mark unread</button>
          <button type="button" class="mt-btn sm" data-bulk="scam" data-hide-in="scam,deleted">Mark spam</button>
          <button type="button" class="mt-btn sm" data-bulk="not_scam" data-show-in="scam">Not spam</button>
          <button type="button" class="mt-btn sm" data-bulk="ignore" data-hide-in="deleted,sent,declined,ignored">Ignore</button>
          <button type="button" class="mt-btn sm danger" data-bulk="delete" data-hide-in="deleted">Delete</button>
          <button type="button" class="mt-btn sm" data-bulk="restore" data-show-in="deleted">Restore</button>
          <button type="button" class="mt-btn sm danger" data-bulk="purge" data-show-in="deleted">Delete forever</button>
        </div>
      </div>
      <ul class="ib-list" id="ib-list"><li class="mt-muted small ib-empty">Loading…</li></ul>
    </section>

    <section class="ib-detail" id="ib-detail">
      <div class="ib-placeholder mt-muted" id="ib-placeholder">Select an email to read it and reply.</div>
      <article id="ib-message" hidden>
        <button type="button" class="mt-btn sm ib-back" id="ib-back">← Back to list</button>
        <div class="ib-actions" id="ib-actions">
          <button type="button" class="mt-btn sm primary" id="ib-act-forward" title="Send a copy to a person or team inside CRES OS">Forward inside</button>
          <button type="button" class="mt-btn sm" id="ib-act-unread">Mark unread</button>
          <button type="button" class="mt-btn sm" id="ib-act-scam">Mark spam</button>
          <button type="button" class="mt-btn sm danger" id="ib-act-delete">Delete</button>
          <button type="button" class="mt-btn sm" id="ib-act-restore" hidden>Restore</button>
        </div>
        <div class="ib-scam" id="ib-scam" hidden></div>
        <header class="ib-head">
          <h2 id="ib-subject"></h2>
          <div class="ib-meta" id="ib-meta"></div>
          <div class="ib-summary" id="ib-summary" hidden></div>
        </header>
        <div class="ib-body" id="ib-body"></div>
        <div class="ib-attach" id="ib-attach" hidden></div>

        <div class="ib-reply" id="ib-reply">
          <div class="ib-reply-head">
            <strong id="ib-reply-title">Reply</strong>
            <span class="mt-muted small" id="ib-drafted-by"></span>
          </div>
          <div class="ib-jarvis">
            <input type="text" id="ib-instructions" placeholder="Tell Jarvis how to reply (optional), e.g. “accept Tuesday, ask for the API docs”" />
            <button type="button" class="mt-btn primary" id="ib-draft">✦ Draft with Jarvis</button>
          </div>
          <textarea id="ib-draft-body" rows="12" placeholder="Write a reply, or let Jarvis draft one. You can edit anything before sending."></textarea>
          <div class="ib-send-row">
            <input type="text" id="ib-cc" placeholder="Extra CC (optional, comma separated)" />
          </div>
          <div class="ib-send-row ib-buttons">
            <button type="button" class="mt-btn" id="ib-ignore" title="Close without replying">Ignore</button>
            <button type="button" class="mt-btn" id="ib-decline" title="Jarvis writes a polite no for you to review">Decline…</button>
            <button type="button" class="mt-btn" id="ib-decline-cancel" hidden>Back to reply</button>
            <span class="ib-grow"></span>
            <span class="mt-muted small" id="ib-saved"></span>
            <button type="button" class="mt-btn primary" id="ib-send">Send reply</button>
          </div>
          <p class="mt-muted small ib-note">Replies go from the company mailbox and thread under the original email. Nothing is sent until you press Send.</p>
        </div>
        <div class="ib-closed" id="ib-closed" hidden></div>
      </article>
    </section>
  </main>

  <main class="mt-lobby" id="ib-denied" hidden>
    <section class="mt-card"><h2>Inbox</h2><p class="mt-muted">The company inbox is for admins only.</p></section>
  </main>

  <div class="mt-toasts" id="toasts"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/toast.js?v=20261109a"></script>
  <script src="/js/api.js?v=20261109c"></script>
  <script src="/js/forwardDialog.js?v=20261109a"></script>
  <script src="/js/inbox.js?v=20261109b"></script>
  <script src="/js/nav.js?v=20261109b"></script>
  <script src="/js/miniShell.js?v=20261109a"></script>
  <script src="/js/pwa.js?v=20261109a"></script>
</body>
</html>
